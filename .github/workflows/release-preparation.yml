name: CLI release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cli-release-preparation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile release PR or exact tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare or update the release pull request
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G '.changes/*.yaml' > /dev/null; then
            plan="$(pnpm release:prepare --json)"
            plan_id="$(jq -r '.planId' <<<"${plan}")"
            pnpm release:prepare --apply --approval "${plan_id}" --json
            git switch -C lervo/release-cli
            git add apps/cli/package.json apps/cli/release-artifact-manifest.json apps/cli/release-sbom.cdx.json pnpm-lock.yaml .changes
            git -c user.name='lervo-release[bot]' -c user.email='lervo-release[bot]@users.noreply.github.com' commit -m 'chore(cli): prepare release'
            git push --force-with-lease origin lervo/release-cli
            body_file="${RUNNER_TEMP}/lervo-release-pr.md"
            cat >"${body_file}" <<'EOF'
          ## Summary

          Prepare the exact reviewed `@lervo/cli` release version and bounded current release notes.

          ## Scope and authority

          In scope: package version, lockfile, current release note, release manifest, SBOM, and consumed intent. Out of scope: npm staging, approval, and publication.

          ## Contract and architecture

          The release-preparation owner generated every version-bound byte from one exact plan. This pull request changes no provider or runtime authority boundary.

          ## Release impact

          This is the release aggregation pull request; the consumed intent and generated version are the review coordinates.

          ## Verification

          The workflow applied the exact release-preparation plan and completed its frozen lockfile, build, manifest, and SBOM owner commands. Pull-request CI remains pending until reported by GitHub checks.

          ## Knowledge and documentation

          N/A: Canonical release documentation and knowledge lifecycle changes belong to the source pull requests aggregated here.

          ## Risk and recovery

          The fixed branch is reconciled with force-with-lease. A stale source, changed intent, owner-command failure, or conflicting remote branch fails closed and is recoverable by rerunning from current `main`.

          ## Checklist

          - [x] N/A: This bot applies a reviewed release plan. Source pull-request authors provide instruction-entrypoint evidence.
          - [x] N/A: Release preparation changes generated artifacts and package coordinates, not source modules.
          - [x] Repository-authored state is bounded; this change adds neither an append-only file nor a one-file-per-operation archive.
          - [x] Lervo-managed, generated, and user-owned bytes retain distinct owners.
          - [x] N/A: Each aggregated source pull request provides its canonical documentation and roadmap evidence.
          - [ ] Relevant tests, `pnpm quality:check`, and required Lervo migration/lint checks pass. Pending pull-request CI.
          - [x] No secret, mutable credential, or unsupported authority is included.
          EOF
            open_pr_number="$(gh pr list --base main --head lervo/release-cli --state open --json number --jq '.[0].number // empty')"
            if [ -z "${open_pr_number}" ]; then
              gh pr create --base main --head lervo/release-cli --title 'chore(cli): prepare release' --body-file "${body_file}"
            else
              gh pr edit "${open_pr_number}" --title 'chore(cli): prepare release' --body-file "${body_file}"
            fi
            echo 'disposition=release_pr' >>"${GITHUB_OUTPUT}"
          else
            echo 'disposition=tag_check' >>"${GITHUB_OUTPUT}"
          fi
      - name: Create and push the exact annotated tag
        if: steps.prepare.outputs.disposition == 'tag_check'
        shell: bash
        run: |
          git config user.name 'lervo-release[bot]'
          git config user.email 'lervo-release[bot]@users.noreply.github.com'
          plan="$(pnpm release:tag --json || true)"
          if [ "$(jq -r '.status // "blocked"' <<<"${plan}")" = 'ready' ]; then
            plan_id="$(jq -r '.planId' <<<"${plan}")"
            pnpm release:tag --apply --approval "${plan_id}" --json
            git push origin "$(jq -r '.tag' <<<"${plan}")"
          fi
