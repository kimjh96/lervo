name: CLI release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cli-release-preparation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile release PR or exact tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare or update the release pull request
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G '.changes/*.yaml' > /dev/null; then
            plan="$(pnpm release:prepare --json)"
            plan_id="$(jq -r '.planId' <<<"${plan}")"
            pnpm release:prepare --apply --approval "${plan_id}" --json
            git switch -C lervo/release-cli
            git add apps/cli/package.json apps/cli/release-artifact-manifest.json apps/cli/release-sbom.cdx.json pnpm-lock.yaml CHANGELOG.md .changes
            git -c user.name='lervo-release[bot]' -c user.email='lervo-release[bot]@users.noreply.github.com' commit -m 'chore(cli): prepare release'
            git push --force-with-lease origin lervo/release-cli
            gh pr view lervo/release-cli --json number >/dev/null 2>&1 || gh pr create --base main --head lervo/release-cli --title 'chore(cli): prepare release' --body 'Exact release intent aggregation. Review version, changelog, generated manifest, and SBOM. This pull request cannot publish to npm.'
            echo 'disposition=release_pr' >>"${GITHUB_OUTPUT}"
          else
            echo 'disposition=tag_check' >>"${GITHUB_OUTPUT}"
          fi
      - name: Create and push the exact annotated tag
        if: steps.prepare.outputs.disposition == 'tag_check'
        shell: bash
        run: |
          plan="$(pnpm release:tag --json || true)"
          if [ "$(jq -r '.status // "blocked"' <<<"${plan}")" = 'ready' ]; then
            plan_id="$(jq -r '.planId' <<<"${plan}")"
            pnpm release:tag --apply --approval "${plan_id}" --json
            git push origin "$(jq -r '.tag' <<<"${plan}")"
          fi
