name: CLI release preparation

on:
  workflow_run:
    workflows: [Code quality]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: cli-release-preparation
  cancel-in-progress: false

env:
  RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RELEASE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
  GH_TOKEN: ${{ github.token }}

jobs:
  route:
    # Only preparing a release pull request builds the darwin native files (ADR-0564), so only
    # pending intent needs a macOS runner, on the pinned image (ADR-0581). Creating the exact tag runs on Linux and does not wait
    # for scarce macOS capacity.
    name: Choose the reconcile runner
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - name: Check out pending release intent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          sparse-checkout: .changes
          persist-credentials: false
      - name: Route by pending intent
        id: route
        shell: bash
        run: |
          if compgen -G '.changes/*.yaml' > /dev/null; then
            echo 'runner=macos-15' >>"${GITHUB_OUTPUT}"
          else
            echo 'runner=ubuntu-latest' >>"${GITHUB_OUTPUT}"
          fi
  reconcile:
    name: Reconcile release PR or exact tag
    needs: route
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 30
    # Preparation on macOS commits the manifest of darwin native files built here, so it uses the
    # Xcode that CI's native-runtime job uses (ADR-0581). Linux ignores the variable.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Admit exact successful current main
        id: admission
        run: node scripts/release/commands/check-release-ci.mjs --plan
      - name: Set up pnpm
        if: steps.admission.outputs.status == 'ready'
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        if: steps.admission.outputs.status == 'ready'
        run: pnpm install --frozen-lockfile
      - name: Check the pinned darwin toolchain
        if: steps.admission.outputs.status == 'ready' && runner.os == 'macOS'
        run: node scripts/distribution/check-darwin-toolchain.mjs
      - name: Check source release completion
        if: steps.admission.outputs.status == 'ready'
        shell: bash
        run: |
          git switch -C main "${RELEASE_SOURCE_SHA}"
          git branch --set-upstream-to=origin/main main
          base="$(git rev-parse "${RELEASE_SOURCE_SHA}^")"
          pnpm release:completion:check --base "${base}"
      - name: Prepare or update the release pull request
        if: steps.admission.outputs.status == 'ready'
        id: prepare
        shell: bash
        run: node scripts/release/commands/reconcile-release-workflow.mjs candidate
      - name: Create and push the exact annotated tag
        if: steps.admission.outputs.status == 'ready' && steps.prepare.outputs.disposition == 'tag_check'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/commands/reconcile-release-workflow.mjs tag
