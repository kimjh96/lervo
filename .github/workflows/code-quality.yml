name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ESLint and Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check code quality
        run: pnpm quality:check
      - name: Check types against the supported Node minimum
        run: pnpm typecheck
      - name: Check architecture boundaries
        run: pnpm architecture:check
      - name: Check pull-request release completion
        if: github.event_name == 'pull_request'
        run: pnpm release:completion:check --base "${{ github.event.pull_request.base.sha }}"
      - name: Check direct-main release completion
        if: github.event_name == 'push'
        run: pnpm release:completion:check --base "${{ github.event.before }}"
