name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact revision to verify; a moved branch is rejected
        type: string
        required: false
      base_sha:
        description: Exact comparison base for generated release verification
        type: string
        required: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  # Reuse lookup reads earlier runs, jobs and receipt artifacts of this repository.
  actions: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan verification
    # Planning needs only Git, Node and the GitHub API, so the build starts without waiting for lint.
    if: github.event_name != 'pull_request' || github.head_ref != 'lervo/release-cli' || github.event.pull_request.head.repo.full_name != github.repository
    outputs:
      coverage: ${{ steps.plan.outputs.coverage }}
      revision: ${{ steps.plan.outputs.revision }}
      base: ${{ steps.plan.outputs.baseRevision }}
      commitHead: ${{ steps.plan.outputs.commitHead }}
      distribution: ${{ steps.distribution.outputs.required }}
      tree: ${{ steps.reuse.outputs.tree }}
      testDigest: ${{ steps.reuse.outputs.testDigest }}
      releaseMetadata: ${{ steps.plan.outputs.releaseMetadata }}
      buildReceipt: ${{ steps.reuse.outputs.buildReceipt }}
      reuseQuality: ${{ steps.reuse.outputs.reuseQuality }}
      reuseBuild: ${{ steps.reuse.outputs.reuseBuild }}
      reuseTests: ${{ steps.reuse.outputs.reuseTests }}
      reuseDistribution: ${{ steps.reuse.outputs.reuseDistribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Plan exact verification scope
        id: plan
        env:
          EXPECTED_REVISION: ${{ inputs.expected_sha }}
        run: node scripts/quality/ci-plan.mjs
      - name: Plan distribution verification
        id: distribution
        shell: bash
        run: |
          required=false
          if [ '${{ steps.plan.outputs.coverage }}' = full ]; then
            # Without pending intent, a pull request is what main will reuse, so it verifies distribution too.
            if [ '${{ github.event_name }}' = workflow_dispatch ] || [ '${{ github.event_name }}' = schedule ] || { { [ '${{ github.event_name }}' = push ] || [ '${{ github.event_name }}' = pull_request ]; } && ! compgen -G '.changes/*.yaml' > /dev/null; }; then
              required=true
            fi
          fi
          echo "required=${required}" >>"${GITHUB_OUTPUT}"
      - name: Plan reuse of identical verified content
        id: reuse
        env:
          COVERAGE: ${{ steps.plan.outputs.coverage }}
          DISTRIBUTION_REQUIRED: ${{ steps.distribution.outputs.required }}
          RELEASE_METADATA: ${{ steps.plan.outputs.releaseMetadata }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/ci-reuse.mjs

  quality:
    name: ESLint and Prettier
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check introduced commits
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.commitHead }}
        run: pnpm commit:lint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check code quality
        if: needs.plan.outputs.reuseQuality != 'true'
        run: pnpm quality:check
      - name: Check types against the supported Node minimum
        if: needs.plan.outputs.coverage == 'full' && needs.plan.outputs.reuseQuality != 'true'
        # The whole-repository type check outgrew Node 22's default heap on the 16 GB runner
        # (out of memory on 2026-11-17); give it an explicit, bounded heap.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck
      - name: Check architecture boundaries
        if: needs.plan.outputs.reuseQuality != 'true'
        run: pnpm architecture:check
      - name: Check documentation lifecycle
        if: needs.plan.outputs.reuseQuality != 'true'
        run: pnpm docs:check
      - name: Check branding and natural-language contracts
        if: needs.plan.outputs.reuseQuality != 'true'
        run: pnpm brand:check && pnpm evaluation:natural-language:check
      - name: Check explicit verification release completion
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: pnpm release:completion:check --base "$BASE_SHA"
      - name: Check pull-request release completion
        if: github.event_name == 'pull_request'
        run: pnpm release:completion:check --base "${{ github.event.pull_request.base.sha }}"
      - name: Check direct-main release completion
        if: github.event_name == 'push'
        run: pnpm release:completion:check --base "${{ github.event.before }}"

  native-runtime-reuse:
    name: Reuse native runtime artifacts
    needs: plan
    if: needs.plan.outputs.coverage == 'full' && needs.plan.outputs.reuseBuild == ''
    # Most changes leave the darwin native inputs alone, so this Linux job installs the bytes an
    # earlier verified build produced for the same inputs instead of compiling them on macOS
    # (ADR-0590). Every step may fail; then `restored` stays unset and native-runtime builds.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.find.outputs.run }}
      artifact: ${{ steps.find.outputs.artifact }}
      restored: ${{ steps.reused.outputs.restored }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Find a verified build of identical native inputs
        id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution/native-runtime-reuse.mjs find
      # The daily audit reuses nothing (ADR-0564); its build checks that the bytes still reproduce.
      - name: Download the verified native build
        id: download
        if: steps.find.outputs.run != '' && github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ steps.find.outputs.artifact }}
          path: ${{ runner.temp }}/native-runtime-reuse
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
      - name: Validate and install the verified native build
        id: restore
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: node scripts/distribution/native-runtime-reuse.mjs restore "${{ runner.temp }}/native-runtime-reuse"
      - name: Bind artifact to this source and workflow
        id: bind
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: node scripts/distribution/native-runtime-transfer.mjs create "${{ runner.temp }}/native-runtime"
      - name: Share exact native artifact
        id: share
        if: steps.bind.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Report the reused native build
        id: reused
        if: steps.share.outcome == 'success'
        run: echo "restored=true" >>"${GITHUB_OUTPUT}"

  native-runtime:
    name: Native runtime artifacts
    needs: [plan, native-runtime-reuse]
    if: ${{ !cancelled() && needs.plan.outputs.coverage == 'full' && needs.plan.outputs.reuseBuild == '' && needs.native-runtime-reuse.outputs.restored != 'true' }}
    # The release manifest records these bytes, so the job names an image and an Xcode instead of
    # following macos-latest and its default Xcode (ADR-0581).
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Check the pinned darwin toolchain
        run: node scripts/distribution/check-darwin-toolchain.mjs
      - name: Compile universal native runtime artifacts
        run: |
          node packages/filesystem-durability/scripts/build-native.mjs
          node packages/cas/scripts/build-native.mjs
      - name: Bind artifact to this source and workflow
        run: node scripts/distribution/native-runtime-transfer.mjs create "${{ runner.temp }}/native-runtime"
      - name: Share exact native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      # Offering the build for reuse is an optimization; a failure there never fails this job.
      - name: Key this build by its native inputs
        id: reusable
        continue-on-error: true
        run: node scripts/distribution/native-runtime-reuse.mjs create "${{ runner.temp }}/native-runtime-reusable"
      # The daily audit finds a reusable build and still compiles, so it proves the bytes reproduce.
      - name: Download the reusable build of identical inputs
        id: earlier
        if: github.event_name == 'schedule' && needs.native-runtime-reuse.outputs.run != '' && steps.reusable.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.native-runtime-reuse.outputs.artifact }}
          path: ${{ runner.temp }}/native-runtime-earlier
          run-id: ${{ needs.native-runtime-reuse.outputs.run }}
          github-token: ${{ github.token }}
      - name: Require the reusable build to equal this build
        if: steps.earlier.outcome == 'success'
        run: node scripts/distribution/native-runtime-reuse.mjs compare "${{ runner.temp }}/native-runtime-reusable" "${{ runner.temp }}/native-runtime-earlier"
      - name: Offer this build for identical native inputs
        if: steps.reusable.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reusable.outputs.artifact }}
          path: ${{ runner.temp }}/native-runtime-reusable
          if-no-files-found: error
          retention-days: 30

  release-artifacts:
    name: Release manifest and SBOM
    # The build consumes only the plan, so it runs beside lint; the aggregate still requires both.
    needs: [plan, native-runtime-reuse, native-runtime]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.coverage == 'full' && (needs.native-runtime.result == 'success' || needs.native-runtime-reuse.outputs.restored == 'true' || needs.plan.outputs.reuseBuild != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REUSED_RUN: ${{ needs.plan.outputs.reuseBuild }}
    steps:
      # Tag admission requires this step's exact name in the run it admits (ADR-0572). An exact run
      # reuses only a build that was itself exact.
      - name: "Release metadata mode: ${{ needs.plan.outputs.releaseMetadata == 'generated' && 'generated' || 'exact' }}"
        run: echo "This run verifies the committed CLI release metadata as ${RELEASE_METADATA:-exact}."
        env:
          RELEASE_METADATA: ${{ needs.plan.outputs.releaseMetadata }}
      - name: Reuse the exact tree's verified build
        if: env.REUSED_RUN != ''
        run: echo "Run ${REUSED_RUN} built and verified this exact tree; see its Release manifest and SBOM job."
      - name: Check out repository
        if: env.REUSED_RUN == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        if: env.REUSED_RUN == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        if: env.REUSED_RUN == ''
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        if: env.REUSED_RUN == ''
        run: pnpm install --frozen-lockfile
      - name: Download exact native artifact
        if: env.REUSED_RUN == ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
      - name: Validate native artifact before build
        if: env.REUSED_RUN == ''
        run: node scripts/distribution/native-runtime-transfer.mjs restore "${{ runner.temp }}/native-runtime"
      - name: Build release artifact
        if: env.REUSED_RUN == ''
        run: pnpm build
      # A release candidate, or a change that edits the files, must commit this build's exact bytes.
      - name: Verify release manifest
        id: manifest
        if: env.REUSED_RUN == '' && needs.plan.outputs.releaseMetadata != 'generated'
        run: pnpm release:manifest:check
      - name: Verify release SBOM
        id: sbom
        if: env.REUSED_RUN == '' && needs.plan.outputs.releaseMetadata != 'generated'
        run: pnpm release:sbom:check
      # Any other tree may keep older committed bytes; release preparation commits new ones. It still
      # rejects a platform package family that the committed manifest does not approve (ADR-0572).
      - name: Generate release manifest and SBOM from this build
        id: generate
        if: env.REUSED_RUN == '' && needs.plan.outputs.releaseMetadata == 'generated'
        run: pnpm release:manifest:update --committed-families && pnpm release:sbom:update
      # A failed check or generation gets the files to commit, so the fix needs no other build.
      - name: Generate release metadata to commit
        if: env.REUSED_RUN == '' && failure() && (steps.manifest.outcome == 'failure' || steps.sbom.outcome == 'failure' || steps.generate.outcome == 'failure')
        run: pnpm release:manifest:update && pnpm release:sbom:update
      - name: Report generated release metadata
        if: env.REUSED_RUN == '' && ((success() && needs.plan.outputs.releaseMetadata == 'generated') || (failure() && (steps.manifest.outcome == 'failure' || steps.sbom.outcome == 'failure' || steps.generate.outcome == 'failure')))
        shell: bash
        env:
          REPORT_MODE: ${{ (steps.manifest.outcome == 'failure' || steps.sbom.outcome == 'failure' || steps.generate.outcome == 'failure') && 'exact' || needs.plan.outputs.releaseMetadata }}
        run: node scripts/release/commands/report-cli-release-metadata.mjs "${REPORT_MODE}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Share generated release metadata
        if: env.REUSED_RUN == '' && ((success() && needs.plan.outputs.releaseMetadata == 'generated') || (failure() && (steps.manifest.outcome == 'failure' || steps.sbom.outcome == 'failure' || steps.generate.outcome == 'failure')))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-cli-release-metadata
          path: |
            apps/cli/release-artifact-manifest.json
            apps/cli/release-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Configure Git identity for release metadata tests
        if: env.REUSED_RUN == '' && needs.plan.outputs.reuseTests != ''
        run: |
          git config --global user.name "Lervo CI"
          git config --global user.email "ci@lervo.invalid"
          git config --global init.defaultBranch main
      - name: Test release metadata that reused test results do not cover
        if: env.REUSED_RUN == '' && needs.plan.outputs.reuseTests != ''
        run: pnpm exec vitest run --config=scripts/quality/ci-vitest.config.mjs --maxWorkers=2 --testTimeout=30000 scripts/release/test packages/repository-knowledge-runtime/test/canonical-source-facts.test.ts
      - name: Archive exact build outputs
        if: env.REUSED_RUN == ''
        run: node scripts/quality/ci-build.mjs create "${RUNNER_TEMP}/lervo-ci-build"
      - name: Share exact build with test consumers
        if: env.REUSED_RUN == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-build
          path: ${{ runner.temp }}/lervo-ci-build
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    # Shards still wait for lint, which finishes before the build, so a lint failure spends no shard time.
    needs: [plan, quality, release-artifacts]
    if: ${{ !cancelled() && needs.plan.outputs.coverage == 'full' && needs.quality.result == 'success' && needs.release-artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      REUSED_RUN: ${{ needs.plan.outputs.reuseTests }}
      # Observe-only test input ledger (ADR-0565). Set the repository variable to `off` to stop
      # recording without a commit; it never changes which tests run or the verdict.
      LERVO_CI_TEST_LEDGER: ${{ vars.LERVO_CI_TEST_LEDGER || 'on' }}
    steps:
      - name: Reuse verified tests for identical content
        if: env.REUSED_RUN != ''
        run: echo "Run ${REUSED_RUN} passed this shard for identical content; see its Tests (shard ${{ matrix.shard }}/4) job."
      - name: Check out repository
        if: env.REUSED_RUN == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        if: env.REUSED_RUN == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        if: env.REUSED_RUN == ''
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Configure Git identity for repository fixtures
        if: env.REUSED_RUN == ''
        run: |
          git config --global user.name "Lervo CI"
          git config --global user.email "ci@lervo.invalid"
          git config --global init.defaultBranch main
      - name: Install dependencies
        if: env.REUSED_RUN == ''
        run: pnpm install --frozen-lockfile
      - name: Download exact build outputs
        if: env.REUSED_RUN == ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: workspace-build
          path: ${{ runner.temp }}/lervo-ci-build
      - name: Restore and validate exact build outputs
        if: env.REUSED_RUN == ''
        run: node scripts/quality/ci-build.mjs restore "${RUNNER_TEMP}/lervo-ci-build"
      - name: Run tests
        if: env.REUSED_RUN == ''
        env:
          LERVO_CI_TEST_LEDGER_DIRECTORY: ${{ runner.temp }}/lervo-ci-test-ledger
        run: pnpm test --maxWorkers=2 --testTimeout=30000 --config=scripts/quality/ci-vitest.config.mjs --shard=${{ matrix.shard }}/4
      - name: Publish the test input ledger
        # Failed and cancelled shards have ledgers too; a missing or failed upload never fails the shard.
        if: env.REUSED_RUN == '' && always() && env.LERVO_CI_TEST_LEDGER != 'off'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-ci-test-ledger-${{ matrix.shard }}
          path: ${{ runner.temp }}/lervo-ci-test-ledger/ledger
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  test-shadow:
    name: Test reuse shadow
    # Observe-only shadow comparison (ADR-0565, Stage 2): it predicts which test files an earlier
    # run's result could replace and compares that with this run's ledgers. No job needs it, it
    # never fails the run, and nothing it writes selects, skips or judges a test.
    needs: [plan, release-artifacts, test]
    if: ${{ !cancelled() && needs.plan.outputs.coverage == 'full' && needs.plan.outputs.reuseTests == '' && needs.release-artifacts.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'failure') && vars.LERVO_CI_TEST_LEDGER != 'off' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact build outputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: workspace-build
          path: ${{ runner.temp }}/lervo-ci-build
      - name: Restore and validate exact build outputs
        run: node scripts/quality/ci-build.mjs restore "${RUNNER_TEMP}/lervo-ci-build"
      - name: Download this run's test input ledgers
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: lervo-ci-test-ledger-*
          path: ${{ runner.temp }}/lervo-ci-test-shadow/ledgers
      - name: Compare predicted reuse with this run's results
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/ci-test-shadow.mjs "${RUNNER_TEMP}/lervo-ci-test-shadow/ledgers" "${RUNNER_TEMP}/lervo-ci-test-shadow/output"
      - name: Publish this run's test input index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-ci-test-input-index
          path: ${{ runner.temp }}/lervo-ci-test-shadow/output/index
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Publish the shadow report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-ci-test-shadow
          path: ${{ runner.temp }}/lervo-ci-test-shadow/output/report
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  distribution:
    name: Distribution smoke checks
    needs: [plan, quality, release-artifacts]
    if: ${{ !cancelled() && needs.plan.outputs.distribution == 'true' && needs.quality.result == 'success' && needs.release-artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REUSED_RUN: ${{ needs.plan.outputs.reuseDistribution }}
    steps:
      - name: Reuse the exact tree's verified distribution checks
        if: env.REUSED_RUN != ''
        run: echo "Run ${REUSED_RUN} passed distribution checks for this exact tree; see its Distribution smoke checks job."
      - name: Check out repository
        if: env.REUSED_RUN == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        if: env.REUSED_RUN == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        if: env.REUSED_RUN == ''
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        if: env.REUSED_RUN == ''
        run: pnpm install --frozen-lockfile
      - name: Download exact build outputs
        if: env.REUSED_RUN == ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: workspace-build
          path: ${{ runner.temp }}/lervo-ci-build
      - name: Restore and validate exact build outputs
        if: env.REUSED_RUN == ''
        run: node scripts/quality/ci-build.mjs restore "${RUNNER_TEMP}/lervo-ci-build"
      - name: Verify distributions and packed consumers
        if: env.REUSED_RUN == ''
        run: |
          pnpm release:attestation:check
          pnpm smoke:built-cli
          pnpm smoke:built-hub
          pnpm smoke:hub-distribution
          pnpm smoke:built-node
          pnpm smoke:node-distribution
          pnpm smoke:packed-cli
          pnpm smoke:registry-publish
          pnpm lervo knowledge lint --json

  verification:
    name: CI verification (lervo-ci-v1)
    needs: [plan, quality, release-artifacts, test, distribution]
    if: ${{ always() && (github.event_name != 'pull_request' || github.head_ref != 'lervo/release-cli' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Record complete verification disposition
        env:
          CI_JOBS: ${{ toJSON(needs) }}
        run: node scripts/quality/ci-result.mjs
      - name: Record receipts for components this run executed
        env:
          CI_JOBS: ${{ toJSON(needs) }}
        run: node scripts/quality/ci-receipt.mjs "${RUNNER_TEMP}/lervo-ci-receipts"
      - name: Publish the build receipt
        if: needs.plan.outputs.reuseBuild == '' && needs.release-artifacts.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.buildReceipt }}
          path: ${{ runner.temp }}/lervo-ci-receipts/build.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish the tests receipt
        if: needs.plan.outputs.reuseTests == '' && needs.test.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-ci-tests-${{ needs.plan.outputs.testDigest }}
          path: ${{ runner.temp }}/lervo-ci-receipts/tests.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish the distribution receipt
        if: needs.plan.outputs.reuseDistribution == '' && needs.distribution.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-ci-distribution-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/lervo-ci-receipts/distribution.json
          if-no-files-found: error
          retention-days: 30

  dispatched-status:
    name: Report dispatched verification on the commit
    # A dispatched run is not evaluated as a pull-request check, so the prepared or candidate commit
    # gets its aggregate result as a commit status that pull-request checks show.
    needs: [verification]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the aggregate result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFICATION: ${{ needs.verification.result }}
        run: |
          [[ "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo 'ci_revision_invalid' >&2; exit 1; }
          state=failure
          if [ "${VERIFICATION}" = success ]; then state=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="${state}" -f context='CI verification (lervo-ci-v1)' \
            -f description="Code quality run ${GITHUB_RUN_ID}: ${VERIFICATION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
