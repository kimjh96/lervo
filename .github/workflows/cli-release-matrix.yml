name: CLI release matrix

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact prepared revision to verify; a moved branch is rejected
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cli-release-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan release verification
    if: github.event_name != 'pull_request' || github.head_ref == 'lervo/release-cli'
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      reuse: ${{ steps.plan.outputs.reuse }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reuse lookup reads earlier runs, jobs and release-subject artifacts of this repository.
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Plan exact release verification or reuse
        id: plan
        env:
          EXPECTED_REVISION: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/commands/plan-cli-release-matrix.mjs

  native-runtime:
    name: Native runtime artifacts
    needs: plan
    if: needs.plan.outputs.reuse == ''
    # The release manifest records these bytes, so the job names an image and an Xcode instead of
    # following macos-latest and its default Xcode (ADR-0581).
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Check the pinned darwin toolchain
        run: node scripts/distribution/check-darwin-toolchain.mjs
      - name: Compile universal native runtime artifacts
        run: |
          node packages/filesystem-durability/scripts/build-native.mjs
          node packages/cas/scripts/build-native.mjs
      - name: Bind artifact to this source and workflow
        run: node scripts/distribution/native-runtime-transfer.mjs create "${{ runner.temp }}/native-runtime"
      - name: Share exact native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  packed-cli:
    needs: [plan, native-runtime]
    name: Packed CLI (${{ matrix.os }})
    if: needs.plan.outputs.reuse == ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact native artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
      - name: Validate native artifact before build
        run: node scripts/distribution/native-runtime-transfer.mjs restore "${{ runner.temp }}/native-runtime"
      - name: Build release artifact
        run: pnpm build
      - name: Verify release manifest
        run: pnpm release:manifest:check
      - name: Verify release SBOM
        run: pnpm release:sbom:check
      - name: Verify local release statement
        run: pnpm release:attestation:check
      - name: Prepare and bind exact release subjects
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm release:attestation:prepare "${RUNNER_TEMP}/lervo-release-subjects"
          node scripts/release/commands/cli-release-subjects.mjs bind "${RUNNER_TEMP}/lervo-release-subjects"
      - name: Install packed CLI as a consumer
        if: matrix.os != 'ubuntu-latest'
        run: pnpm smoke:packed-cli
      - name: Publish and install through an isolated registry
        if: matrix.os != 'ubuntu-latest'
        run: pnpm smoke:registry-publish
      # pnpm pack output is not byte-stable, so the Linux smokes install the bound subject file itself.
      - name: Install the bound release tarball as a consumer
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/release/commands/check-packed-cli.mjs --release-subjects "${RUNNER_TEMP}/lervo-release-subjects"
      - name: Publish and install the bound release tarball through an isolated registry
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/release/commands/check-registry-publish.mjs --release-subjects "${RUNNER_TEMP}/lervo-release-subjects"
      - name: Confirm the smoke-tested subjects are still the bound bytes
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/release/commands/cli-release-subjects.mjs confirm "${RUNNER_TEMP}/lervo-release-subjects"
      - name: Keep exact release subjects for publication
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-cli-release-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/lervo-release-subjects
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  attested-cli:
    name: Attested CLI release
    # Signs the subjects packed-cli verified, never a rebuild: pnpm pack output is not byte-stable.
    if: ${{ !cancelled() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event.repository.private != true || github.event.repository.owner.type != 'User') && needs.plan.result == 'success' && (needs.plan.outputs.reuse != '' || needs.packed-cli.result == 'success') }}
    needs: [plan, packed-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Downloads the verified release subjects, possibly from the pre-merge run that verified them.
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The consumer check validates the manifest, which reads the runtime security contract.
      - name: Build the runtime security contract
        run: pnpm --filter @lervo/runtime-security build
      - name: Download verified release subjects
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lervo-cli-release-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/lervo-release-subjects
          run-id: ${{ needs.plan.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify subjects against the tagged tree
        run: node scripts/release/commands/cli-release-subjects.mjs verify "${RUNNER_TEMP}/lervo-release-subjects" --expected-tag "${GITHUB_REF_NAME}"
      - name: Stage the verified subjects for signing
        run: |
          mkdir "${RUNNER_TEMP}/lervo-release"
          find "${RUNNER_TEMP}/lervo-release-subjects" -maxdepth 1 -type f ! -name release-subjects.json -exec cp {} "${RUNNER_TEMP}/lervo-release/" \;
      - name: Attest build provenance
        id: build-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/lervo-release/*.tgz
            ${{ runner.temp }}/lervo-release/release-artifact-manifest.json
            ${{ runner.temp }}/lervo-release/release-sbom.cdx.json
      - name: Attest the tarball SBOM
        id: sbom-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/lervo-release/*.tgz
          sbom-path: ${{ runner.temp }}/lervo-release/release-sbom.cdx.json
      - name: Collect signed bundles
        run: |
          mkdir "${RUNNER_TEMP}/lervo-release/attestations"
          cp "${{ steps.build-attestation.outputs.bundle-path }}" "${RUNNER_TEMP}/lervo-release/attestations/build-provenance.sigstore.json"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" "${RUNNER_TEMP}/lervo-release/attestations/sbom.sigstore.json"
      - name: Verify release attestations as a consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:attestation:verify --release-directory "${RUNNER_TEMP}/lervo-release" --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --source-digest "${GITHUB_SHA}"
      - name: Authorize exact npm publication coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:publication:authorize --release-directory "${RUNNER_TEMP}/lervo-release" --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --source-digest "${GITHUB_SHA}" --dist-tag latest --output "${RUNNER_TEMP}/lervo-publication-authorization.json"
      - name: Upload release files, signed bundles, and publication authorization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lervo-cli-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/lervo-release
            ${{ runner.temp }}/lervo-publication-authorization.json
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub release
    if: ${{ !cancelled() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.plan.result == 'success' && (needs.plan.outputs.reuse != '' || needs.packed-cli.result == 'success') && (needs.attested-cli.result == 'success' || needs.attested-cli.result == 'skipped') }}
    needs: [plan, packed-cli, attested-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Downloads the verified release subjects, possibly from the pre-merge run that verified them.
      actions: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Verify exact current release notes
        run: node scripts/release/commands/check-cli-release-notes.mjs --expected-tag "${GITHUB_REF_NAME}"
      - name: Download verified release subjects
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lervo-cli-release-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/lervo-release-subjects
          run-id: ${{ needs.plan.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify subjects against the tagged tree
        run: node scripts/release/commands/cli-release-subjects.mjs verify "${RUNNER_TEMP}/lervo-release-subjects" --expected-tag "${GITHUB_REF_NAME}"
      # attested-cli signs the verified subjects; a different attested digest is still refused.
      - name: Download attested release files
        if: needs.attested-cli.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lervo-cli-${{ github.ref_name }}
          path: ${{ runner.temp }}/lervo-attested
      - name: Require attested files to equal the verified subjects
        if: needs.attested-cli.result == 'success'
        run: bash scripts/release/lib/compare-attested-subjects.sh "${RUNNER_TEMP}/lervo-release-subjects" "${RUNNER_TEMP}/lervo-attested/lervo-release"
      - name: Create or reconcile the GitHub release with verified subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/lib/publish-github-release.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/lervo-release-subjects"
