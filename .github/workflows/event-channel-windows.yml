name: Event channel (Windows)

# ADR-0602: the event-store wake channel uses named pipes on Windows. This one small job runs only
# the channel tests there, and only when the event store or this workflow changes.
on:
  pull_request:
    paths:
      - packages/event-store-sqlite/**
      - .github/workflows/event-channel-windows.yml
  push:
    branches: [main]
    paths:
      - packages/event-store-sqlite/**
      - .github/workflows/event-channel-windows.yml

permissions:
  contents: read

concurrency:
  group: event-channel-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channel:
    name: Event channel tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the channel tests
        run: pnpm exec vitest run packages/event-store-sqlite/test/change-channel.test.ts
