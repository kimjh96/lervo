name: ADE

# The Lervo ADE's Rust and interface checks (ADR-0613). They run on Linux only and only when the
# ADE or its protocol contract changes; desktop bundles for macOS and Windows build at release.
on:
  pull_request:
    paths:
      - "apps/ade/**"
      - ".changes/ade/**"
      - "packages/session-host-contract/**"
      - ".github/workflows/ade.yml"
  push:
    branches: [main]
    paths:
      - "apps/ade/**"
      - ".changes/ade/**"
      - "packages/session-host-contract/**"
      - ".github/workflows/ade.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ADE checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the ADE release files
        run: node scripts/release/commands/check-ade-release.mjs
      - name: Install the pinned Rust toolchain
        working-directory: apps/ade
        run: rustup toolchain install
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/ade -> target
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      - name: Check the ADE
        run: pnpm ade:check
