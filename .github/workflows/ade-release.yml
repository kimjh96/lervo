name: ADE release

# Tags a prepared ADE release on main as `ade-v<version>` (ADR-0615). It runs only when the ADE's
# release notes change, which only ADE release preparation does, and it has its own concurrency
# group, so it never cancels or delays a CLI run. The ADE creates no GitHub Release before S3.
on:
  push:
    branches: [main]
    paths:
      - ".changes/ade/current-release.md"

permissions:
  contents: write

concurrency:
  group: ade-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the ADE release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tag the prepared release
        run: |
          git config user.name 'lervo-release[bot]'
          git config user.email 'lervo-release[bot]@users.noreply.github.com'
          node scripts/release/commands/tag-ade-release.mjs --push
