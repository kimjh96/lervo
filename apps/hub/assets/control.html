<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Lervo Command 검토</title>
    <link rel="stylesheet" href="/assets/control.css">
    <script type="module" src="/assets/control.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/control" aria-label="Lervo Command 검토 처음으로">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>Lervo Command 검토</span>
      </a>
      <p>대화와 분리된 Hub 승인 화면</p>
    </header>

    <main>
      <section class="panel intro" aria-labelledby="control-title">
        <div>
          <p class="eyebrow">별도 인증 필요</p>
          <h1 id="control-title">실행 범위를 확인한 뒤 승인합니다</h1>
          <p class="supporting">대화 메시지나 반응만으로 승인이 만들어지지 않습니다. 접근 토큰은 현재 탭의 메모리에서만 사용합니다.</p>
        </div>
        <form id="auth-form" class="auth-form">
          <label for="token">Hub 접근 토큰</label>
          <div class="auth-controls">
            <input id="token" type="password" minlength="32" maxlength="4096"
              autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <button type="submit">다시 인증</button>
            <button id="disconnect" class="secondary" type="button" hidden>연결 해제</button>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite">대화에서 받은 검토 주소를 확인하고 토큰을 입력해 주세요.</p>
      </section>

      <section id="review" class="panel review" aria-labelledby="review-title" hidden>
        <header class="review-header">
          <div>
            <p class="eyebrow">Command</p>
            <h2 id="review-title">실행 정보</h2>
          </div>
          <span id="delivery-status" class="badge"></span>
        </header>
        <dl id="command-details" class="details"></dl>

        <div class="approval-heading">
          <div>
            <p class="eyebrow">Approval</p>
            <h2>승인 범위</h2>
          </div>
          <span id="approval-status" class="badge"></span>
        </div>
        <p id="approval-help" class="supporting"></p>
        <ul id="approval-options" class="approval-options"></ul>
      </section>
    </main>
  </body>
</html>
