[package]
name = "lervo-core-link"
version.workspace = true
description = "The ADE session host's adapter for the resident Lervo process, over the core link."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
lervo-session-core = { path = "../session-core" }
lervo-session-protocol = { path = "../session-protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[lints]
workspace = true
