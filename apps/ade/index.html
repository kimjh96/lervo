<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lervo</title>
    <!-- The document's styles load before the first paint, so the launch view shows at once. -->
    <link rel="stylesheet" href="/src/ui/base.css" />
    <link rel="stylesheet" href="/src/app/global.css" />
    <link rel="stylesheet" href="/src/app/launch.css" />
  </head>
  <body>
    <!-- The launch view: the Lervo mark (visual language, "Logo") until the first screen is ready. -->
    <div id="launch" class="launch" aria-hidden="true">
      <svg class="launch-mark" viewBox="0 0 48 48">
        <rect x="7" y="8" width="24" height="9" rx="4.5" fill-opacity="0.38" />
        <rect x="12" y="19.5" width="24" height="9" rx="4.5" fill-opacity="0.68" />
        <rect class="launch-accent" x="17" y="31" width="24" height="9" rx="4.5" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
