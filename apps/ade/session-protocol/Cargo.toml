[package]
name = "lervo-session-protocol"
version.workspace = true
description = "The ADE session-host protocol: generated message types and the frame codec."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jsonschema = { version = "0.63", default-features = false }
regress = "0.10"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
syn = "2"
typify = "0.10"

[lints]
workspace = true
