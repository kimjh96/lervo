[package]
name = "lervo-session-pty"
version = "0.1.0"
description = "The ADE session host's PTY adapter for the CLI conversation."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
portable-pty = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
