[package]
name = "lervo-ade"
version = "0.1.0"
description = "The Lervo desktop shell."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The executable carries the product name, so the menu bar and the Dock show "Lervo" even when
# it runs outside an application bundle.
[[bin]]
name = "Lervo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lervo-session-protocol = { path = "../session-protocol" }
lervo-session-transport = { path = "../session-transport" }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }

[lints]
workspace = true
