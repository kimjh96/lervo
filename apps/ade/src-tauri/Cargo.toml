[package]
name = "lervo-ade"
version.workspace = true
description = "The Lervo desktop shell."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The executable carries the product name, so the menu bar and the Dock show "Lervo" even when
# it runs outside an application bundle.
[[bin]]
name = "Lervo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lervo-session-protocol = { path = "../session-protocol" }
lervo-session-transport = { path = "../session-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSEnumerator", "NSError", "NSString", "NSURL"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }

[lints]
workspace = true
