# The ADE's Rust code: the Tauri shell and the session host (ADR-0613).
[workspace]
resolver = "3"
members = ["src-tauri", "session-host"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
