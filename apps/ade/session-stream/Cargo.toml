[package]
name = "lervo-session-stream"
version.workspace = true
description = "The ADE session host's adapter for provider processes that speak a structured stream."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync"] }

# SIGTERM lets a provider run its own shutdown; nix is already in the tree through portable-pty.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[lints]
workspace = true
