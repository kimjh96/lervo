packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

overrides:
  "@typescript-eslint/tsconfig-utils": 8.67.0
  "@typescript-eslint/types": 8.67.0
  fast-uri: 3.1.5

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y 6.10.2 declares ESLint 9 at most; a probe lint on ESLint 10 confirmed
    # that its rules report as expected for the ADE interface.
    eslint-plugin-jsx-a11y>eslint: "10"
