schemaVersion: 1
suiteId: repository.default.v2
stopOnFailure: true
commands:
  - commandId: repository-lint
    executable: pnpm
    arguments:
      - lint
    cwd: .
    timeoutMs: 300000
    maxOutputBytes: 1048576
    environmentVariableNames: []
  - commandId: repository-typecheck
    executable: pnpm
    arguments:
      - typecheck
    cwd: .
    timeoutMs: 900000
    maxOutputBytes: 1048576
    environmentVariableNames: []
